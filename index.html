<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111417">
<title>training-log</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#111417; --panel:#1a1f24; --panel2:#232a31; --line:#2e373f;
  --fg:#e8edf2; --dim:#8b98a5; --accent:#ff8a3d; --ok:#3ddc84; --bad:#ff5f56;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--fg);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  display:flex; flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
  overscroll-behavior:none;
}
button,input,select{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}

header{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px 16px;border-bottom:1px solid var(--line);flex:none;
}
header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.02em}
header .meta{font-size:13px;color:var(--dim)}
header .ghost{font-size:13px;color:var(--dim);padding:6px 10px;border:1px solid var(--line);border-radius:8px}

main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 16px 24px}
.view{display:none}.view.on{display:block}

nav{
  display:flex;flex:none;border-top:1px solid var(--line);background:var(--panel);
  padding-bottom:env(safe-area-inset-bottom);
}
nav button{flex:1;padding:12px 4px;font-size:12px;color:var(--dim)}
nav button.on{color:var(--accent)}
nav button b{display:block;font-size:19px;font-weight:400;line-height:1.1}

.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.muted{color:var(--dim);font-size:13px}
.rowline{display:flex;align-items:center;justify-content:space-between;gap:10px}

/* 種目選択リスト */
.pick{width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.pick:active{background:var(--panel2)}
.pick .nm{font-size:17px;font-weight:600}
.pick .sub{font-size:12px;color:var(--dim);margin-top:2px}
.pick .ago{font-size:12px;color:var(--dim);white-space:nowrap}

/* 入力 */
.stepper{display:flex;align-items:stretch;gap:8px;margin-top:6px}
.stepper button{
  width:64px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;
  font-size:26px;font-weight:300;color:var(--fg)
}
.stepper button:active{background:var(--accent);color:#111}
.stepper input{
  flex:1;min-width:0;text-align:center;font-size:30px;font-weight:600;
  background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 4px
}
label.fld{display:block;font-size:12px;color:var(--dim);margin:14px 0 0;letter-spacing:.04em}

.rir{display:flex;gap:6px;margin-top:6px}
.rir button{
  flex:1;padding:14px 0;background:var(--panel2);border:1px solid var(--line);
  border-radius:10px;font-size:19px;font-weight:600
}
.rir button.on{background:var(--accent);color:#111;border-color:var(--accent)}

.commit{
  width:100%;margin-top:16px;padding:18px;border-radius:12px;
  background:var(--accent);color:#111;font-size:19px;font-weight:700
}
.commit:disabled{background:var(--panel2);color:var(--dim)}

/* セット行 */
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.setrow:last-child{border-bottom:none}
.setrow .n{color:var(--dim);font-size:13px;width:22px}
.setrow .v{flex:1;font-size:16px}
.setrow .r{font-size:13px;color:var(--accent);white-space:nowrap}
.setrow .x{color:var(--dim);font-size:18px;padding:0 4px}

.sect{font-size:12px;color:var(--dim);letter-spacing:.08em;margin:20px 0 8px}
.sect:first-child{margin-top:0}

input.text,select.text{
  width:100%;background:var(--panel2);border:1px solid var(--line);
  border-radius:10px;padding:13px;margin-top:6px
}
.btn{width:100%;padding:14px;border-radius:10px;background:var(--panel2);
  border:1px solid var(--line);font-weight:600;margin-top:10px}
.btn.primary{background:var(--accent);color:#111;border-color:var(--accent)}

.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);
  background:var(--ok);color:#062;padding:10px 18px;border-radius:99px;font-size:14px;
  font-weight:700;opacity:0;pointer-events:none;transition:opacity .18s;z-index:9}
.toast.on{opacity:1}
.empty{text-align:center;color:var(--dim);padding:40px 20px;font-size:14px;line-height:1.9}
</style>
</head>
<body>

<header>
  <h1 id="ttl">記録</h1>
  <span class="meta" id="hmeta"></span>
  <button class="ghost" id="btn-export">書き出し</button>
</header>

<main>
  <!-- ============ 記録 ============ -->
  <section class="view on" id="v-log">
    <div id="log-pick"></div>
    <div id="log-entry" hidden></div>
  </section>

  <!-- ============ 種目 ============ -->
  <section class="view" id="v-ex">
    <div class="card">
      <div class="sect" style="margin-top:0">種目を追加</div>
      <input class="text" id="ex-name" placeholder="種目名（例: Incline dumbbell press）" autocapitalize="off">
      <select class="text" id="ex-pat"></select>
      <p class="muted" style="margin:10px 0 0">
        動作パターンは必須。判定器はこの単位で集計するため、紐付けのない種目は測定に使えない。
      </p>
      <button class="btn primary" id="ex-add">追加</button>
    </div>
    <div id="ex-list"></div>
  </section>

  <!-- ============ 体重 ============ -->
  <section class="view" id="v-bw">
    <div class="card">
      <div class="sect" style="margin-top:0">今日の体重</div>
      <div class="stepper">
        <button data-bw="-0.1">−</button>
        <input id="bw-val" type="number" inputmode="decimal" step="0.1" value="70.0">
        <button data-bw="0.1">＋</button>
      </div>
      <button class="btn primary" id="bw-save">記録</button>
      <p class="muted" style="margin:12px 0 0">
        測定時刻も一緒に残る。水分で日々1kg以上動くので、あとから同じ時間帯の日だけを抜き出せるようにしてある。
      </p>
    </div>
    <div id="bw-list"></div>
  </section>
</main>

<nav>
  <button class="on" data-tab="log"><b>＋</b>記録</button>
  <button data-tab="ex"><b>≡</b>種目</button>
  <button data-tab="bw"><b>⚖</b>体重</button>
</nav>

<div class="toast" id="toast"></div>
<script type="module" src="app.js"></script>
</body>
</html>
